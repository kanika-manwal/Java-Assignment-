<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 620px; margin: 40px auto; padding: 20px; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 9px; margin-top: 5px; box-sizing: border-box; }
        button { margin-top: 18px; padding: 10px 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Feedback Form</h2>
    <form action="submitFeedback" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="feedbackType">Feedback Type</label>
        <select id="feedbackType" name="feedbackType" required>
            <option value="">-- Select --</option>
            <option value="Complaint">Complaint</option>
            <option value="Suggestion">Suggestion</option>
            <option value="Compliment">Compliment</option>
        </select>

        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5" required></textarea>

        <button type="submit">Submit Feedback</button>
    </form>
</body>
</html>
